name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm ci
      - run: npm run audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:api
      - run: npm run agent:demo
      - run: npm run eval
      - run: npm run eval:adversarial
      - run: npm run evidence:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence-v1
          path: |
            evidence/v1/contract.json
            reports/adversarial-evals.json
          if-no-files-found: error
