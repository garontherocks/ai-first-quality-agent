version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One monthly PR for every compatible (minor/patch) update.
      # Major updates arrive as individual PRs so breaking changes get reviewed.
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8.x declares peer typescript ">=4.8.4 <6.1.0", so a
      # TypeScript major breaks `npm ci`. Remove once typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns:
          - '*'
